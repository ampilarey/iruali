name: Deploy TEST (immediate)

# Fires as soon as main is pushed — fast path for test.iruali.mv auto-pull.
# Cron (scripts/self-update-test.sh) remains a fallback if the webhook fails.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-test-immediate
  cancel-in-progress: false

jobs:
  pull-test-now:
    name: Webhook pull (test.iruali.mv)
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Trigger TEST deploy webhook
        env:
          DEPLOY_SECRET: ${{ secrets.TEST_DEPLOY_WEBHOOK_SECRET }}
        run: |
          if [ -z "${DEPLOY_SECRET}" ]; then
            echo "::error::TEST_DEPLOY_WEBHOOK_SECRET missing on GitHub environment 'test'"
            exit 1
          fi

          # If Imunify360 bot-protection returns 403, whitelist GitHub Actions
          # (or disable webshield for /api/deploy/*) — see docs/TEST_AUTO_DEPLOY.md
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/deploy-webhook.json -w "%{http_code}" \
              -X POST "https://test.iruali.mv/api/deploy/test-pull" \
              -H "Authorization: Bearer ${DEPLOY_SECRET}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -H "User-Agent: Iruali-Test-Deploy/1.0 (+GitHubActions)" \
              -d "{\"sha\":\"${GITHUB_SHA}\"}")
            echo "Attempt ${attempt}: HTTP ${code}"
            cat /tmp/deploy-webhook.json || true
            echo ""
            if [ "$code" = "202" ]; then
              echo "TEST deploy triggered for ${GITHUB_SHA}"
              exit 0
            fi
            if [ "$code" = "403" ] && grep -qi 'Imunify360' /tmp/deploy-webhook.json 2>/dev/null; then
              echo "::error::Imunify360 blocked GitHub Actions (403). Whitelist automation IPs or allow /api/deploy/test-pull — cron remains fallback."
            fi
            sleep 5
          done

          echo "::error::Webhook deploy failed after retries (hook is primary; cron is fallback only)"
          exit 1

      - name: Brief smoke (homepage + health)
        run: |
          sleep 20
          curl -fsS -o /dev/null -w "health %{http_code}\n" https://test.iruali.mv/api/health
          curl -fsS -o /dev/null -w "home %{http_code}\n" https://test.iruali.mv/
