name: Deploy TEST (immediate)

# Fires as soon as main is pushed — fast path for test.iruali.mv auto-pull.
# Cron (scripts/self-update-test.sh) remains a fallback if the webhook fails.

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-test-immediate
  cancel-in-progress: false

jobs:
  pull-test-now:
    name: Webhook pull (test.iruali.mv)
    # Only after the Tests workflow is green on main (manual runs always go)
    # and only for a push to this repository's main: a pull request from a fork whose branch is also
    # called "main" must not start a job that holds the deploy secret
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    environment: test
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Trigger TEST deploy webhook
        id: hook
        env:
          DEPLOY_SECRET: ${{ secrets.TEST_DEPLOY_WEBHOOK_SECRET }}
        run: |
          if [ -z "${DEPLOY_SECRET}" ]; then
            echo "::error::TEST_DEPLOY_WEBHOOK_SECRET missing on GitHub environment 'test'"
            exit 1
          fi

          # If Imunify360 bot-protection returns 403, whitelist GitHub Actions
          # (or disable webshield for /api/deploy/*) — see docs/TEST_AUTO_DEPLOY.md
          blocked=0
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/deploy-webhook.json -w "%{http_code}" \
              -X POST "https://test.iruali.mv/api/deploy/test-pull" \
              -H "Authorization: Bearer ${DEPLOY_SECRET}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -H "User-Agent: Iruali-Test-Deploy/1.0 (+GitHubActions)" \
              -d "{\"sha\":\"${DEPLOY_SHA}\"}")
            echo "Attempt ${attempt}: HTTP ${code}"
            cat /tmp/deploy-webhook.json || true
            echo ""
            if [ "$code" = "202" ]; then
              echo "TEST deploy triggered for ${DEPLOY_SHA}"
              exit 0
            fi
            if [ "$code" = "403" ] && grep -qi 'Imunify360' /tmp/deploy-webhook.json 2>/dev/null; then
              echo "Imunify360 blocked this attempt (403)."
              blocked=$((blocked + 1))
            fi
            sleep 5
          done

          # The host's firewall (not the app) turned GitHub away on all six attempts. The test site
          # still pulls main by itself within a minute (cron, scripts/self-update-test.sh), so this is
          # a warning: a red check here also stops the production deploy (deploy-live.sh waits for
          # green), for something the code did not cause. Any other failure (wrong secret, 404, 500,
          # no answer) still fails.
          if [ "$blocked" = "6" ]; then
            echo "::warning::Imunify360 blocked GitHub Actions (403) on every attempt. test.iruali.mv updates through its cron instead. To get the fast path back, allow GitHub's addresses or /api/deploy/test-pull at the host (docs/TEST_AUTO_DEPLOY.md)."
            echo "blocked=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Webhook deploy failed after retries (hook is primary; cron is fallback only)"
          exit 1

      - name: Brief smoke (homepage + health)
        # Skipped when the firewall turned the webhook away: it would turn these requests away too
        if: steps.hook.outputs.blocked != '1'
        run: |
          sleep 20
          curl -fsS -o /dev/null -w "health %{http_code}\n" https://test.iruali.mv/api/health
          curl -fsS -o /dev/null -w "home %{http_code}\n" https://test.iruali.mv/
