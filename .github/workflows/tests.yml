name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: these jobs only check out the code
permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit (MariaDB)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: iruali_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, gd, zip, pdo_mysql, bcmath
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Code style (Pint)
        run: ./vendor/bin/pint --test
      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          mkdir -p storage/framework/{cache/data,sessions,views} storage/logs storage/app/public bootstrap/cache
      - name: Run tests
        run: php artisan test
        env:
          DB_HOST: 127.0.0.1

  browser:
    name: Browser checkout (Playwright)
    runs-on: ubuntu-latest # @playwright/test 1.61+ installs Chromium on Ubuntu 26.04 (package.json pins 1.65.1)
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, gd, zip, pdo_sqlite, sqlite3, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund
      # The site serves the committed public/build (cPanel has no Node): build it again here and fail when
      # it differs, so a change to resources/ (or new Tailwind classes in Blade) can't ship with stale assets
      - name: Built assets are committed and current
        run: |
          npm run build
          test -f public/build/manifest.json
          git status --porcelain -- public/build
          git diff --exit-code --stat -- public/build && test -z "$(git status --porcelain -- public/build)" \
            || (echo "public/build is out of date: run npm run build and commit public/build" && exit 1)
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          mkdir -p storage/framework/{cache/data,sessions,views} storage/logs storage/app/public bootstrap/cache
      - name: Run the checkout browser test
        run: npm run test:browser
        env:
          CI: "1"
      - name: Upload traces and report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/browser/results
            tests/browser/report
          if-no-files-found: ignore

  static-analysis:
    name: Larastan level 5
    runs-on: ubuntu-latest
    # Blocking: app/ is clean at level 5 with no ignore rules, so any finding is new and must be fixed
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, gd, zip, pdo_mysql, bcmath
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Analyse app/ at level 5
        run: composer analyse -- --no-progress --error-format=github
      # Known security advisories in the packages the site runs (dev tools are left out)
      - name: Composer security audit
        run: composer audit --no-dev
